<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barman V3 - Firmware Updater</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #1e1e1e; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); max-width: 600px; width: 100%; text-align: center; border: 1px solid #333; }
        h1 { color: #f39c12; margin-bottom: 20px; font-weight: 600; }
        p { line-height: 1.5; color: #ccc; font-size: 1.05em; margin-bottom: 30px; }
        button { background-color: #f39c12; color: #121212; border: none; padding: 15px 30px; font-size: 1.2em; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background-color: #e67e22; box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }
        button:disabled { background-color: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        #console { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; text-align: left; padding: 15px; border-radius: 8px; margin-top: 25px; height: 200px; overflow-y: auto; font-size: 0.9em; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Barman V3 Updater</h1>
        <p>Connect your machine via USB cable and click the button below. Your Wi-Fi settings, calibration, and drink statistics are 100% safe.</p>
        
        <button id="updateBtn">Connect & Update</button>
        <div id="console"></div>
    </div>

    <script type="module">
        import { Transport, ESPLoader } from "https://cdn.jsdelivr.net/npm/esptool-js@0.5.4/+esm";
        
        const updateBtn = document.getElementById('updateBtn');
        const consoleDiv = document.getElementById('console');
        
        function log(message) {
            consoleDiv.style.display = 'block';
            consoleDiv.innerHTML += message + "\n";
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        const terminal = {
            clean: () => { consoleDiv.innerHTML = ""; },
            writeLine: (data) => { log(data); },
            write: (data) => { log(data); }
        };

        updateBtn.onclick = async () => {
            try {
                const port = await navigator.serial.requestPort();
                updateBtn.disabled = true;
                updateBtn.innerText = "Updating... Please wait";
                log("Port selected. Connecting to Barman...");

                const transport = new Transport(port);
                
                const loader = new ESPLoader({
                    transport: transport,
                    baudrate: 115200,
                    terminal: terminal
                });
                
                await loader.main(); 
                log("Connected to ESP32 successfully.");

                log("Downloading firmware file (BarmanV3_0_14.bin)...");
                const response = await fetch('BarmanV3_0_14.bin');
                if (!response.ok) throw new Error("File BarmanV3_0_14.bin not found on server.");
                const buffer = await response.arrayBuffer();
                const firmwareData = new Uint8Array(buffer);
                log("Download complete. File size: " + firmwareData.length + " bytes.");

                log("Starting flash process. DO NOT DISCONNECT!");
                
                let lastPercent = -1;
                
                await loader.write_flash({
                    fileArray: [{ data: firmwareData, address: 0x10000 }],
                    flashSize: 'keep',
                    flashMode: 'keep',
                    flashFreq: 'keep',
                    eraseAll: false,
                    compress: true,
                    reportProgress: (fileIndex, written, total) => {
                        const percent = Math.round((written / total) * 100);
                        if (percent > lastPercent) {
                            consoleDiv.innerHTML = consoleDiv.innerHTML.replace(/Flashing: .*\n?$/, '');
                            log("Flashing: " + percent + "%");
                            lastPercent = percent;
                        }
                    }
                });

                log("SUCCESS! Firmware updated successfully.");
                log("Restarting Barman...");
                await loader.hard_reset();
                
                updateBtn.innerText = "Update Complete!";
                updateBtn.style.backgroundColor = "#4CAF50";
                
            } catch (error) {
                log("ERROR: " + error.message);
                updateBtn.disabled = false;
                updateBtn.innerText = "Try Again";
                updateBtn.style.backgroundColor = "#f39c12";
            }
        };
    </script>
</body>
</html>
